<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <div class="todo-container mx-auto">

            <header class="text-center mb-4">
                <h1>My To-Do List</h1>
                <p class="text-muted">Organize your day, one task at a time.</p>
            </header>

            <!-- Task input -->
            <form id="taskForm" class="input-group mb-4">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Enter a new task..."
                    aria-label="New task"
                    maxlength="200"
                    required>

                <button type="submit" class="btn btn-primary">
                    + Add Task
                </button>
            </form>

            <!-- Task statistics -->
            <div class="row g-2 mb-4 text-center">
                <div class="col-4">
                    <div class="stat-card">
                        <h3 id="totalCount">0</h3>
                        <small>Total</small>
                    </div>
                </div>

                <div class="col-4">
                    <div class="stat-card">
                        <h3 id="activeCount">0</h3>
                        <small>Active</small>
                    </div>
                </div>

                <div class="col-4">
                    <div class="stat-card">
                        <h3 id="completedCount">0</h3>
                        <small>Completed</small>
                    </div>
                </div>
            </div>

            <!-- Task filters -->
            <div class="filter-buttons mb-3 d-flex gap-2 flex-wrap">
                <button class="btn btn-primary filter-btn"
                        data-filter="all">All</button>

                <button class="btn btn-outline-primary filter-btn"
                        data-filter="active">Active</button>

                <button class="btn btn-outline-primary filter-btn"
                        data-filter="completed">Completed</button>
            </div>

            <!-- Task list -->
            <ul id="taskList" class="list-group"></ul>

            <p id="emptyMessage" class="text-center text-muted py-4">
                No tasks yet. Add your first task!
            </p>

            <div class="text-center mt-3">
                <button id="clearCompleted"
                        class="btn btn-sm btn-outline-danger">
                    Clear Completed Tasks
                </button>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
